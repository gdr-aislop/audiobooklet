[workspace]
resolver = "2"
members = [
    "crates/abs-api",
    "crates/abs-storage",
    "crates/abs-core",
    "crates/abs-player",
    "app",
]

[workspace.package]
version = "0.9.11"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/gdr-aislop/audiobooklet"

[workspace.dependencies]
# Generated API client build chain
progenitor = "0.9"
progenitor-client = "0.9"
openapiv3 = "2"
syn = "2"
prettyplease = "0.2"

# Shared runtime/data deps
# `net` backs `abs_core::connection::probe_reachable`'s TCP reachability check (the Connection
# page's local-network-address policy); everything else is runtime/macros/fs as before.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "net", "time"] }
futures = "0.3"
# `native-tls` is the backend already in use via reqwest's default features; naming it
# explicitly additionally unlocks the client-certificate API (`ClientBuilder::identity`,
# `Identity::from_pkcs12_der`) the Connection page's mTLS setting needs.
reqwest = { version = "0.12", features = ["json", "stream", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
schemars = "0.8"
thiserror = "2"
tracing = "0.1"
# NFD decomposition + combining-mark stripping for diacritic-insensitive search
# (`abs_core::search::normalize_for_search`).
unicode-normalization = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Rolling log file for `app/src/crash_reporting.rs` — durable, local-only diagnostics for a
# deployed app with no attached terminal (see that module's doc comment).
tracing-appender = "0.2"
# Local (never networked) native crash dumps — see `app/src/crash_reporting.rs`.
crash-handler = "0.8"
minidumper = "0.11"

# Storage
# Stay on 0.8: 0.9 needs rustc 1.94, and the Flatpak SDK (GNOME 47 / rust-stable) ships 1.89.
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"] }
directories = "5"
# `fs` backs the free-space check the download sheet's size estimates are compared against
# (statvfs); rustix is already in the tree via the gtk stack, so this adds no new compile cost.
rustix = { version = "1", features = ["fs"] }
# In-process image decoding, shared by the cover pipeline: `abs-core` validates a downloaded
# cover body before writing it into the evictable cache (a non-image 200 response must never
# poison `cover_cache_path`), and the app's `CoverImage` falls back to it for WebP, which
# gdk-pixbuf has no loader for on the target distros. Same feature set in both places, so
# "valid enough to cache" and "decodable for display" can't drift apart.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# D-Bus (MPRIS, ModemManager call watching) — already present transitively via gtk4/adw; pinned
# here as a direct dependency of abs-player, not a new external crate (no zbus).
gio = "0.20"
glib = "0.20"

# Test-only
tempfile = "3"
wiremock = "0.6"

# Local crates
abs-api = { path = "crates/abs-api" }
abs-storage = { path = "crates/abs-storage" }
abs-core = { path = "crates/abs-core" }
abs-player = { path = "crates/abs-player" }
