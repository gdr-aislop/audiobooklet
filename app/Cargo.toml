[package]
name = "audiobooklet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Client for an Audiobookshelf server, designed for mobile Linux"

[[bin]]
name = "audiobooklet"
path = "src/main.rs"

[dependencies]
abs-api.workspace = true
abs-core.workspace = true
abs-storage.workspace = true
abs-player.workspace = true
futures.workspace = true
gio.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

# Feature-gated to the API surface available in libadwaita 1.2 / GTK4 4.8 (PureOS Crimson's
# actual shipped versions — see docs/architecture note in the plan). This is a compile-time
# guarantee, not just discipline: enabling only up to these version features means anything from
# libadwaita 1.4+ (AdwNavigationSplitView, AdwBreakpoint, AdwToolbarView, AdwSwitchRow, ...) or
# GTK 4.10+ simply isn't exposed by these crates, so accidentally depending on it is a compile
# error here rather than a runtime surprise on Crimson.
gtk4 = { version = "0.9", features = ["v4_8"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_2"] }

# gettext translations (see `src/i18n.rs` and `po/`). `gettext-system` links the C library's own
# libintl (glibc on every target distro) instead of compiling a bundled GNU gettext.
gettext-rs = { version = "0.7", features = ["gettext-system"] }

# Cover-art decoding fallback: gdk-pixbuf has no WebP support on the target
# distros (no loader shipped in Debian bookworm, PureOS Crimson's base), while
# Audiobookshelf serves many covers as WebP. Decoded in-process and turned
# into a `gdk::MemoryTexture` when pixbuf can't handle a file.
image.workspace = true

# Local, Breakpad-format crash dumps for native (signal-level) crashes a Rust panic hook can't
# catch — a segfault/abort inside the GTK/GStreamer/glib C code this binary links against. See
# `crash_reporting.rs`'s doc comment for the out-of-process client/server design.
crash-handler.workspace = true
minidumper.workspace = true

# Remembered passwords live in the desktop keyring: the Secret Service on the host, the Secret
# portal inside Flatpak. Pure Rust, so no new system library for the AppImage. See
# `password_keyring.rs`.
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }
# Listening sessions are dated on the local calendar (a pause past midnight starts a new one).
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true
reqwest.workspace = true
serde_json.workspace = true
wiremock = "0.6"
hound = "3"
# Crafting expired-JWT fixtures for the token-refresh tests (see home.rs's tests).
base64 = "0.22"

# Debian packaging for PureOS Crimson (Librem 5) and Ubuntu 24.04, built by
# .github/workflows/release.yml via `cargo deb`. Depends is written against
# bookworm (Crimson's base) package names; the libssl3 alternative keeps the
# same deb installable on Ubuntu 24.04, which renamed the package to libssl3t64.
[package.metadata.deb]
# Up to 0.9.5 this package was called abs-app; installing audiobooklet removes it.
conflicts = "abs-app"
replaces = "abs-app"
maintainer = "gdr-aislop <gdr-aislop@users.noreply.github.com>"
copyright = "GPL-3.0-or-later"
section = "sound"
priority = "optional"
extended-description = """\
GNOME-native client for an Audiobookshelf media server, designed for mobile \
Linux (Phosh on the Librem 5, also usable on desktop).

Browse your library, stream or play downloaded audiobooks and podcasts, \
and keep listening progress in sync with the server. Integrates with the \
desktop via MPRIS2 and pauses during phone calls."""
depends = """\
libgtk-4-1, libadwaita-1-0, \
gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-libav, \
glib-networking, libssl3 | libssl3t64, libpulse0"""
# The .desktop comes from `scripts/build-l10n.sh build/l10n` (run it before `cargo deb`; the release
# workflow does): it is the source file with translated Name/Comment/Keywords merged in. Each
# language in po/LINGUAS also needs a line here installing its catalog, e.g.
#   ["../build/l10n/locale/de/LC_MESSAGES/audiobooklet.mo", "usr/share/locale/de/LC_MESSAGES/", "644"],
assets = [
    ["target/release/audiobooklet", "usr/bin/", "755"],
    ["../build/l10n/io.github.gdr_aislop.audiobooklet.desktop", "usr/share/applications/", "644"],
    ["../build/l10n/locale/pl/LC_MESSAGES/audiobooklet.mo", "usr/share/locale/pl/LC_MESSAGES/", "644"],
    ["assets/io.github.gdr_aislop.audiobooklet.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../LICENSE", "usr/share/doc/audiobooklet/", "644"],
]
