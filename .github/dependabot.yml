# Dependabot version updates. Dependabot reads the dependencies itself (Cargo.toml/Cargo.lock,
# the workflow files); this only says where to look, how often, and how to group the PRs.
version: 2
updates:
  - package-ecosystem: "cargo"
    # The workspace root: its Cargo.toml and Cargo.lock cover every crate (crates/*, app).
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # The gtk-rs crates must move together, and they're held to GTK 4.8 / libadwaita 1.2
      # (PureOS Crimson) by feature flags in app/Cargo.toml — their own PR, to test on the phone.
      gtk-rs:
        patterns:
          - "gtk4"
          - "gtk4-*"
          - "libadwaita"
          - "libadwaita-*"
          - "glib"
          - "glib-*"
          - "gio"
          - "gio-*"
          - "gdk4"
          - "gdk4-*"
          - "gdk-pixbuf"
          - "gdk-pixbuf-*"
          - "gsk4"
          - "gsk4-*"
          - "pango"
          - "pango-*"
          - "cairo-rs"
          - "cairo-sys-rs"
          - "graphene-rs"
          - "graphene-sys"
      gstreamer:
        patterns:
          - "gstreamer"
          - "gstreamer-*"
      # Every other crate's minor and patch updates in one weekly PR.
      cargo-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    # Workflows in .github/workflows.
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
